name: ci

# Thin glue: the checks themselves live in tools/, so a lane that passes here
# passes on a workstation too.
#
# Every command below was run by hand on linux/amd64 against V 0.5.2 before it
# was written here; the workflow itself has not been run on a runner. The
# compiler comes from setup-v and may be newer than 0.5.2, which is the part of
# this file with the most room to surprise.

on:
  push:
  pull_request:

jobs:
  lanes:
    name: lanes (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vlang/setup-v@v1
      - name: compilers the lanes need
        # clang and tcc are both packaged for Ubuntu. tcc is not needed to build
        # the module, it is needed to prove the addon gate fires.
        run: sudo apt-get update && sudo apt-get install -y clang tcc
      - name: format
        run: v fmt -verify simd/ simd_test.v tier_test.v
      - name: every lane this host can select
        run: tools/check-lanes.sh

  targets:
    name: cross targets (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vlang/setup-v@v1
      - name: cross tools
        # mingw-w64 is packaged for Ubuntu, zig is not (packages.ubuntu.com has
        # no `zig` for noble), so zig comes from an action. A tool that still
        # fails to appear is not fatal: check-targets.sh prints a reason for each
        # target it skips.
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - uses: mlugg/setup-zig@v2
      - name: windows, arm64, and the pure V fallbacks
        run: tools/check-targets.sh
      - name: NEON words against the assembler
        run: tools/check-neon-encodings.sh

  macos:
    name: macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vlang/setup-v@v1
      - run: v test .

  windows:
    name: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vlang/setup-v@v1
      - run: v test .
